[build-system]
requires = ["setuptools>=77"]   # 77 reads the SPDX license string below
build-backend = "setuptools.build_meta"

[project]
name = "folio-exchange"
version = "0.2.0"
description = "Set up, test and run scheduled data exchanges between FOLIO and vendor platforms from shared recipes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "FOLIO-Exchange contributors" }]
keywords = ["FOLIO", "library", "libraries", "library services platform", "Eureka", "collectionHQ", "MARC", "SFTP",
            "integration", "data exchange"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Education",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Utilities",
]
dependencies = [
  "requests>=2.31",
  "pymarc>=5.1",
  "paramiko>=3.4",
  "PyYAML>=6.0",
  "python-dateutil>=2.8",
  "keyring>=25",            # the OS credential store holds passwords on a library PC
  "truststore>=0.10",       # folio.ca_bundle: windows trusts the Windows certificate store
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.urls]
Repository = "https://github.com/ByYudkowskysTentacle/FOLIO-Exchange"
Documentation = "https://github.com/ByYudkowskysTentacle/FOLIO-Exchange/tree/main/docs"
Issues = "https://github.com/ByYudkowskysTentacle/FOLIO-Exchange/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "jsonschema>=4.20", "pytest-qt>=4.4"]
desktop = ["PySide6-Essentials>=6.7"]   # the desktop app; Essentials (no add-ons) keeps the download small

[project.scripts]
folio-exchange = "folio_exchange.cli:main"

[project.gui-scripts]
folio-exchange-app = "folio_exchange.desktop:main"   # a GUI script: Windows opens no console window

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
folio_exchange = ["recipes/*/*.yaml", "recipes/*/*.md", "recipes/*/samples/*", "schemas/*.json", "web/*", "desktop/*.svg", "recipe_sources.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/conftest.py loads pytest-qt itself, and only where Qt loads, so the rest of the suite runs without the
# desktop extra (pytest-qt refuses to start without a working Qt).
addopts = "-p no:pytest-qt"
