name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
# Actions are pinned to full commit SHAs, with the tag in a comment, so a moved tag cannot change what runs.
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest   # the first library runs it on a Windows PC
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Libraries Qt's offscreen platform needs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3
      - run: python -m pip install -c constraints.txt -e ".[dev,desktop]"   # the tested dependency versions
      - run: ruff check .
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen   # the desktop app's widget tests draw nothing on screen
          FX_REQUIRE_QT: "1"           # a Qt that does not load fails the run, rather than skip those tests
  secrets:
    # This repo is public: fail the build if anything that looks like a credential is committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
